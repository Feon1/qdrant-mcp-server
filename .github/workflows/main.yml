name: Keep Render Services Alive

on:
  schedule:
    # Пн-Пт: 10:00–22:00 МСК = 07:00–19:00 UTC
    - cron: '*/10 7-18 * * 1-5'
    - cron: '0 19 * * 1-5'

    # Сб-Вс: 10:00–22:00 МСК = 07:00–19:00 UTC
    - cron: '*/10 7-18 * * 0,6'
    - cron: '0 19 * * 0,6'

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MCP Hub
        continue-on-error: true
        run: |
          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
          curl -s -o /dev/null -w "MCP Hub → HTTP %{http_code}\n" \
            --max-time 120 \
            --retry 2 \
            --retry-delay 15 \
            https://xiaozhi-mcphub-deploy-server.onrender.com/health

      - name: Ping Qdrant MCP Server
        continue-on-error: true
        run: |
          curl -s -o /dev/null -w "Qdrant MCP → HTTP %{http_code}\n" \
            --max-time 120 \
            --retry 2 \
            --retry-delay 15 \
            https://qdrant-mcp-server.onrender.com/health
