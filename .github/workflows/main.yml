name: Keep Render Services Alive

on:
  schedule:
    - cron: '*/14 9-18 * * 1-5'
    - cron: '0 19 * * 1-5'
    - cron: '*/14 5-18 * * 0,6'
    - cron: '0 19 * * 0,6'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MCP Hub
        run: |
          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
          curl -s -o /dev/null -w "MCP Hub → HTTP %{http_code}\n" --max-time 60 https://xiaozhi-mcphub-deploy-server.onrender.com/health

      - name: Ping Qdrant MCP Server
        run: |
          curl -s -o /dev/null -w "Qdrant MCP → HTTP %{http_code}\n" --max-time 60 https://qdrant-mcp-server.onrender.com/health
