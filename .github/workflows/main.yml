name: Keep Render MCP Hub Alive

on:
  schedule:
    # Пинг каждые 14 минут в интервале 07:00–21:00 МСК (UTC+3)
    # В UTC это: 04:00–18:00
    # GitHub Actions cron — по UTC
    - cron: '*/14 4-17 * * *'
    # Последний пинг в 18:00 UTC (21:00 МСК)
    - cron: '0 18 * * *'
  workflow_dispatch:  # кнопка «Run workflow» для теста

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MCP Hub
        run: |
          echo "Pinging at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            https://xiaozhi-mcphub-deploy-server.onrender.com/health
      - name: Ping MCP Server
        run: |
          echo "Pinging MCP Server at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            https://qdrant-mcp-server.onrender.com/health     
