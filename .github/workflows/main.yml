name: Keep Render Services Alive

on:
  schedule:
    # Пн-Пт: 10:00–21:50 МСК каждые 10 минут
    - cron: '*/10 10-21 * * 1-5'
    # Пн-Пт: Финальный пинг в 22:00 МСК
    - cron: '0 22 * * 1-5'
    
    # Сб-Вс: 10:00–21:50 МСК каждые 10 минут
    - cron: '*/10 10-21 * * 0,6'
    # Сб-Вс: Финальный пинг в 22:00 МСК
    - cron: '0 22 * * 0,6'
    
  timezone: "Europe/Moscow" # <--- Явно указываем часовой пояс (Москва)
  workflow_dispatch: # <--- Оставляем для ручного теста

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MCP Hub (Root Endpoint)
        continue-on-error: true # <--- Важно: если один упал, пингуем второй
        run: |
          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
          HTTP_CODE=$(curl -s -o /tmp/mcphub_response.txt -w "%{http_code}" \
            --max-time 120 \
            --retry 3 \
            --retry-delay 15 \
            https://xiaozhi-mcphub-deploy-server.onrender.com/)
          
          echo "MCP Hub → HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ MCP Hub is alive"
          else
            echo "❌ MCP Hub returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Ping Qdrant MCP Server
        continue-on-error: true
        run: |
          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
          HTTP_CODE=$(curl -s -o /tmp/qdrant_response.txt -w "%{http_code}" \
            --max-time 120 \
            --retry 3 \
            --retry-delay 15 \
            https://qdrant-mcp-server.onrender.com/)
          
          echo "Qdrant MCP → HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Qdrant MCP is alive"
          else
            echo "❌ Qdrant MCP returned HTTP $HTTP_CODE"
            exit 1
          fi
