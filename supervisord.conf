[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:mcphub]
command=node /app/mcphub/dist/index.js
directory=/app/mcphub
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="3000"

[program:qdrant-proxy]
command=python -m uvicorn main:app --host 0.0.0.0 --port 8200
directory=/app/qdrant-proxy
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=QDRANT_URL="%(ENV_QDRANT_URL)s",QDRANT_API_KEY="%(ENV_QDRANT_API_KEY)s",POLZA_EMBEDDING_API_KEY="%(ENV_POLZA_EMBEDDING_API_KEY)s",COLLECTION_NAME="%(ENV_COLLECTION_NAME)s",PROXY_TOKEN="%(ENV_PROXY_TOKEN)s"

[program:qdrant-mcp]
command=python -m uvicorn main:app --host 0.0.0.0 --port 8300
directory=/app/qdrant
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PROXY_URL="http://localhost:8200/search",PROXY_TOKEN="%(ENV_PROXY_TOKEN)s"
