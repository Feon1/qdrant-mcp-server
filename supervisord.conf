[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:mcphub]
command=node /app/mcphub/dist/index.js
directory=/app/mcphub
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="3000"

[program:qdrant-mcp]
command=python -m uvicorn main:app --host 0.0.0.0 --port 8300
directory=/app/qdrant
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PROXY_URL="%(ENV_PROXY_URL)s",PROXY_TOKEN="%(ENV_PROXY_TOKEN)s"
